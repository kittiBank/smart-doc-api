services:
  db:
    image: pgvector/pgvector:pg17
    container_name: smart-doc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdoc}
      POSTGRES_DB: ${POSTGRES_DB:-smartdoc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdoc} -d ${POSTGRES_DB:-smartdoc}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
